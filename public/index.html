<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión - Inventario</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="center">
    <form id="auth" class="card login">
      <h1 id="titulo">Iniciar sesión</h1>
      <p class="muted">Gestor de inventario</p>
      <div id="campoNombre" hidden>
        <label for="nombre">Nombre</label>
        <input id="nombre" autocomplete="name">
      </div>
      <label for="email">Correo</label>
      <input id="email" type="email" required autocomplete="email">
      <label for="password">Contraseña</label>
      <input id="password" type="password" required minlength="6" autocomplete="current-password">
      <p id="error" class="error" role="alert"></p>
      <button class="full" id="enviar">Entrar</button>
      <p class="switch"><span id="pregunta">¿No tienes cuenta?</span> <button type="button" class="link" id="alternar">Regístrate</button></p>
    </form>
  </div>
  <script src="js/login.js"></script>
</body>
</html>
